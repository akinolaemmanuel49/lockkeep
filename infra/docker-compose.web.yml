name: lockkeep
services:
  web:
    build:
      context: ../lockkeep-frontend/.
      args:
        - VITE_AUTH0_DOMAIN=${VITE_AUTH0_DOMAIN:-}
        - VITE_AUTH0_CLIENT_ID=${VITE_AUTH0_CLIENT_ID:-}
        - VITE_AUTH0_REDIRECT_URI=${VITE_AUTH0_REDIRECT_URI}
        - VITE_LOCKKEEP_API_URI=${VITE_LOCKKEEP_API_URI}
    labels:
      - "traefik.http.routers.lockkeep-web.rule=Host(`lockkeep.localhost`)"
      - "traefik.http.services.lockkeep-web.loadbalancer.server.port=3000"
    networks:
      - lockkeep-network

networks:
  lockkeep-network:
    external: true
