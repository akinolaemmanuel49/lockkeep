name: lockkeep-ci-demo

on:
  workflow_dispatch:
  push:
    paths:
      - "lockkeep-sdk/**"
      - "lockkeep-example/**"
      - ".github/workflows/ci-secrets.yml"

jobs:
  read-and-print-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            lockkeep-sdk/package-lock.json
            lockkeep-example/package-lock.json

      - name: Build SDK
        working-directory: lockkeep-sdk
        run: |
          npm ci
          npm run build

      - name: Install & build example
        working-directory: lockkeep-example
        run: |
          npm ci
          npm run build

      - name: Read & inject secrets, then run the app (single API call)
        working-directory: lockkeep-example
        env:
          LOCKKEEP_API_KEY: ${{ secrets.LOCKKEEP_API_KEY }}
          LOCKKEEP_API_URI: ${{ secrets.LOCKKEEP_API_URI }}
        run: node dist/index.js run -- node dist/app.js