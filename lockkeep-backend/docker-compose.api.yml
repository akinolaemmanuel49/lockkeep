services:
  api:
    build: .
    labels:
      - "traefik.http.routers.lockkeep-api.rule=Host(`api.lockkeep.localhost`)"
      - "traefik.http.services.lockkeep-api.loadbalancer.server.port=8000"
    # restart: always
    ports:
      - 8000:8000
    environment:
      - PORT
      - MONGODB_URI
      - ALLOWED_ORIGINS
      - JWT_SECRET
      - JWT_REFRESH_SECRET
      - AUTH0_DOMAIN
      - AUTH0_CLIENT_ID
      - AUTH0_CLIENT_SECRET
      - AUTH0_REDIRECT_URI
    networks:
      - lockkeep-network

networks:
  lockkeep-network:
    external: true
